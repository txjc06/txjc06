<svg width="900" height="248" viewBox="0 0 900 248" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="txjc — Full-Stack Software Engineer">
  <defs>
    <clipPath id="card-clip">
      <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="14"/>
    </clipPath>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0f1520"/>
      <stop offset="100%" stop-color="#111a28"/>
    </linearGradient>

    <linearGradient id="top-accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aurora-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 30) rotate(135) scale(360 220)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 230) rotate(-15) scale(300 140)">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dot-grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b949e" fill-opacity="0.16"/>
    </pattern>

    <radialGradient id="grid-fade" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="grid-mask">
      <rect x="0" y="0" width="900" height="248" fill="url(#grid-fade)"/>
    </mask>

    <filter id="term-shadow" x="522" y="24" width="358" height="212" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      52%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .cursor { animation: blink 1.15s step-end infinite; }
    .dot-pulse { animation: pulse 2.6s ease-in-out infinite; }
  </style>

  <!-- Clipped card internals -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="900" height="248" fill="url(#bg-grad)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#dot-grid)" mask="url(#grid-mask)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#aurora-1)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#aurora-2)"/>

    <!-- Subtle geometric arcs -->
    <circle cx="760" cy="124" r="190" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    <circle cx="760" cy="124" r="260" stroke="#818cf8" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Top hairline accent -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#top-accent)"/>

    <!-- Eyebrow pill -->
    <rect x="44" y="34" width="96" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="58" cy="46" r="3.5" fill="#38bdf8" class="dot-pulse"/>
    <text x="69" y="50" class="mono" font-size="11.5" font-weight="500" fill="#94a3b8">~/txjc06</text>

    <!-- Display name + blinking cursor -->
    <text x="44" y="114" class="sans" font-size="56" font-weight="800" letter-spacing="-1.8" fill="#f0f6fc">txjc</text>
    <rect x="142" y="74" width="4" height="41" rx="2" fill="#38bdf8" class="cursor"/>

    <!-- Role & tagline -->
    <text x="44" y="146" class="sans" font-size="18" font-weight="600" fill="#7dd3fc">Full-Stack Software Engineer</text>
    <text x="44" y="172" class="sans" font-size="13.5" font-weight="400" fill="#8b949e">Fast, lean, local-first software across desktop, mobile &amp; web.</text>

    <!-- Subtle stack pills -->
    <g transform="translate(44, 194)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="13" cy="12" r="3" fill="#dea584"/>
      <text x="22" y="16" class="mono" font-size="11" fill="#c9d1d9">Rust</text>

      <rect x="68" y="0" width="72" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="81" cy="12" r="3" fill="#a78bfa"/>
      <text x="90" y="16" class="mono" font-size="11" fill="#c9d1d9">Kotlin</text>

      <rect x="148" y="0" width="60" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="161" cy="12" r="3" fill="#fb923c"/>
      <text x="170" y="16" class="mono" font-size="11" fill="#c9d1d9">Java</text>

      <rect x="216" y="0" width="74" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="229" cy="12" r="3" fill="#38bdf8"/>
      <text x="238" y="16" class="mono" font-size="11" fill="#c9d1d9">Python</text>

      <rect x="298" y="0" width="54" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="311" cy="12" r="3" fill="#34d399"/>
      <text x="320" y="16" class="mono" font-size="11" fill="#c9d1d9">Web</text>

      <rect x="360" y="0" width="68" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="373" cy="12" r="3" fill="#facc15"/>
      <text x="382" y="16" class="mono" font-size="11" fill="#c9d1d9">Linux</text>
    </g>

    <!-- Right-side terminal spec card -->
    <g filter="url(#term-shadow)">
      <rect x="542" y="36" width="318" height="176" rx="10" fill="#090d14" stroke="#293548" stroke-width="1"/>
      <!-- Titlebar -->
      <path d="M542 46C542 40.4772 546.477 36 552 36H850C855.523 36 860 40.4772 860 46V64H542V46Z" fill="#111824"/>
      <line x1="542" y1="64" x2="860" y2="64" stroke="#212b3b" stroke-width="1"/>
      <circle cx="558" cy="50" r="4" fill="#f87171" fill-opacity="0.75"/>
      <circle cx="572" cy="50" r="4" fill="#fbbf24" fill-opacity="0.75"/>
      <circle cx="586" cy="50" r="4" fill="#34d399" fill-opacity="0.75"/>
      <text x="701" y="54" text-anchor="middle" class="mono" font-size="11" fill="#6e7681">profile.toml</text>

      <!-- TOML content -->
      <text x="560" y="88" class="mono" font-size="11.5" fill="#818cf8">[profile]</text>

      <text x="560" y="110" class="mono" font-size="11.5" fill="#8b949e">handle</text>
      <text x="626" y="110" class="mono" font-size="11.5" fill="#475569">=</text>
      <text x="641" y="110" class="mono" font-size="11.5" fill="#7dd3fc">"txjc"</text>

      <text x="560" y="131" class="mono" font-size="11.5" fill="#8b949e">role</text>
      <text x="626" y="131" class="mono" font-size="11.5" fill="#475569">=</text>
      <text x="641" y="131" class="mono" font-size="11.5" fill="#a5f3fc">"full-stack"</text>

      <text x="560" y="152" class="mono" font-size="11.5" fill="#8b949e">builds</text>
      <text x="626" y="152" class="mono" font-size="11.5" fill="#475569">=</text>
      <text x="641" y="152" class="mono" font-size="11.5" fill="#64748b">[<tspan fill="#c9d1d9">"desktop"</tspan>, <tspan fill="#c9d1d9">"mobile"</tspan>, <tspan fill="#c9d1d9">"web"</tspan>]</text>

      <text x="560" y="173" class="mono" font-size="11.5" fill="#8b949e">ethos</text>
      <text x="626" y="173" class="mono" font-size="11.5" fill="#475569">=</text>
      <text x="641" y="173" class="mono" font-size="11.5" fill="#86efac">"fast &amp; local-first"</text>

      <text x="560" y="194" class="mono" font-size="11.5" fill="#8b949e">location</text>
      <text x="626" y="194" class="mono" font-size="11.5" fill="#475569">=</text>
      <text x="641" y="194" class="mono" font-size="11.5" fill="#c4b5fd">"North Pole"</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="14" stroke="#30363d" stroke-width="1.5"/>
</svg>
