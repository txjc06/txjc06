<svg width="900" height="248" viewBox="0 0 900 248" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="txjc — Full-Stack Software Engineer">
  <defs>
    <clipPath id="card-clip">
      <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="14"/>
    </clipPath>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="top-accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="aurora-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 30) rotate(135) scale(360 220)">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 230) rotate(-15) scale(300 140)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dot-grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.18"/>
    </pattern>

    <radialGradient id="grid-fade" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="grid-mask">
      <rect x="0" y="0" width="900" height="248" fill="url(#grid-fade)"/>
    </mask>

    <filter id="term-shadow" x="522" y="24" width="358" height="212" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      52%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .cursor { animation: blink 1.15s step-end infinite; }
    .dot-pulse { animation: pulse 2.6s ease-in-out infinite; }
  </style>

  <!-- Clipped card internals -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="900" height="248" fill="url(#bg-grad)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#dot-grid)" mask="url(#grid-mask)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#aurora-1)"/>
    <rect x="0" y="0" width="900" height="248" fill="url(#aurora-2)"/>

    <!-- Subtle geometric arcs -->
    <circle cx="760" cy="124" r="190" stroke="#0284c7" stroke-opacity="0.09" stroke-width="1"/>
    <circle cx="760" cy="124" r="260" stroke="#4f46e5" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Top hairline accent -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#top-accent)"/>

    <!-- Eyebrow pill -->
    <rect x="44" y="34" width="96" height="24" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="58" cy="46" r="3.5" fill="#0284c7" class="dot-pulse"/>
    <text x="69" y="50" class="mono" font-size="11.5" font-weight="500" fill="#475569">~/txjc06</text>

    <!-- Display name + blinking cursor -->
    <text x="44" y="114" class="sans" font-size="56" font-weight="800" letter-spacing="-1.8" fill="#0f172a">txjc</text>
    <rect x="142" y="74" width="4" height="41" rx="2" fill="#0284c7" class="cursor"/>

    <!-- Role & tagline -->
    <text x="44" y="146" class="sans" font-size="18" font-weight="600" fill="#0369a1">Full-Stack Software Engineer</text>
    <text x="44" y="172" class="sans" font-size="13.5" font-weight="400" fill="#57606a">Fast, lean, local-first software across desktop, mobile &amp; web.</text>

    <!-- Subtle stack pills -->
    <g transform="translate(44, 194)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="13" cy="12" r="3" fill="#c2410c"/>
      <text x="22" y="16" class="mono" font-size="11" fill="#1f2328">Rust</text>

      <rect x="68" y="0" width="72" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="81" cy="12" r="3" fill="#7c3aed"/>
      <text x="90" y="16" class="mono" font-size="11" fill="#1f2328">Kotlin</text>

      <rect x="148" y="0" width="60" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="161" cy="12" r="3" fill="#ea580c"/>
      <text x="170" y="16" class="mono" font-size="11" fill="#1f2328">Java</text>

      <rect x="216" y="0" width="74" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="229" cy="12" r="3" fill="#0284c7"/>
      <text x="238" y="16" class="mono" font-size="11" fill="#1f2328">Python</text>

      <rect x="298" y="0" width="54" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="311" cy="12" r="3" fill="#059669"/>
      <text x="320" y="16" class="mono" font-size="11" fill="#1f2328">Web</text>

      <rect x="360" y="0" width="68" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="373" cy="12" r="3" fill="#ca8a04"/>
      <text x="382" y="16" class="mono" font-size="11" fill="#1f2328">Linux</text>
    </g>

    <!-- Right-side terminal spec card -->
    <g filter="url(#term-shadow)">
      <rect x="542" y="36" width="318" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <!-- Titlebar -->
      <path d="M542 46C542 40.4772 546.477 36 552 36H850C855.523 36 860 40.4772 860 46V64H542V46Z" fill="#f6f8fa"/>
      <line x1="542" y1="64" x2="860" y2="64" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="558" cy="50" r="4" fill="#ef4444" fill-opacity="0.7"/>
      <circle cx="572" cy="50" r="4" fill="#f59e0b" fill-opacity="0.7"/>
      <circle cx="586" cy="50" r="4" fill="#10b981" fill-opacity="0.7"/>
      <text x="701" y="54" text-anchor="middle" class="mono" font-size="11" fill="#64748b">profile.toml</text>

      <!-- TOML content -->
      <text x="560" y="88" class="mono" font-size="11.5" font-weight="600" fill="#4f46e5">[profile]</text>

      <text x="560" y="110" class="mono" font-size="11.5" fill="#57606a">handle</text>
      <text x="626" y="110" class="mono" font-size="11.5" fill="#94a3b8">=</text>
      <text x="641" y="110" class="mono" font-size="11.5" fill="#0369a1">"txjc"</text>

      <text x="560" y="131" class="mono" font-size="11.5" fill="#57606a">role</text>
      <text x="626" y="131" class="mono" font-size="11.5" fill="#94a3b8">=</text>
      <text x="641" y="131" class="mono" font-size="11.5" fill="#0e7490">"full-stack"</text>

      <text x="560" y="152" class="mono" font-size="11.5" fill="#57606a">builds</text>
      <text x="626" y="152" class="mono" font-size="11.5" fill="#94a3b8">=</text>
      <text x="641" y="152" class="mono" font-size="11.5" fill="#94a3b8">[<tspan fill="#1f2328">"desktop"</tspan>, <tspan fill="#1f2328">"mobile"</tspan>, <tspan fill="#1f2328">"web"</tspan>]</text>

      <text x="560" y="173" class="mono" font-size="11.5" fill="#57606a">ethos</text>
      <text x="626" y="173" class="mono" font-size="11.5" fill="#94a3b8">=</text>
      <text x="641" y="173" class="mono" font-size="11.5" fill="#047857">"fast &amp; local-first"</text>

      <text x="560" y="194" class="mono" font-size="11.5" fill="#57606a">location</text>
      <text x="626" y="194" class="mono" font-size="11.5" fill="#94a3b8">=</text>
      <text x="641" y="194" class="mono" font-size="11.5" fill="#6d28d9">"North Pole"</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.75" y="0.75" width="898.5" height="246.5" rx="14" stroke="#d0d7de" stroke-width="1.5"/>
</svg>
